[project]
name = "gobots"
version = "0.1.0"
description = "The GoBots to Hugging Face's Transformers. A repository for exploring and understanding transformer architectures"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.1.1",
    "huggingface-hub>=0.35.3",
    "torch>=2.8.0",
    "torchao>=0.13.0",
    "torchtune>=0.6.1",
    "trackio>=0.4.1",
    "transformers>=4.56.2",
]

[dependency-groups]
dev = [
    "ruff>=0.13.2",
]
