training:
  run_name: "moe_test"
  model_type: "moe"
  max_steps: 92000
  warmup_steps: 2000
  lr_scheduler_type: "warmup_stable_decay"
  lr_scheduler_kwargs:
    num_decay_steps: 9200
    decay_type: "linear"
  use_bf16: true
  use_tf32: true
  log_level: "info"
  logging_steps: 1
  output_dir: "./output_dir"
  per_device_train_batch_size: 10
  gradient_accumulation_steps: 4
  save_strategy: "steps"
  save_steps: 5000
  save_total_limit: 5
  logging_strategy: "steps"
  optim: "adamw_torch_fused"
  learning_rate: 1.5e-03
  max_grad_norm: 10.0
  weight_decay: 0.01
  auxiliary_loss_weight: 1e-4
  z_loss_weight: 0.001
  mtp_weight: 0.01
  zclip_config:
    mode: "zscore"
    alpha: 0.97
    clip_option: "adaptive_scaling"
    z_thresh: 2.5
    clip_factor: 0.95
    max_grad_norm: 1.0
    warmup_steps: 25
  context_length: 2048
